name: Pipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create file
        run: echo "Build number ${{ github.run_number }}" > report.txt
      - name: Save file
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt

  show:
    runs-on: ubuntu-latest
    steps:
      - name: Get file
        uses: actions/download-artifact@v4
        with:
          name: report
      - name: Show file
        run: cat report.txt